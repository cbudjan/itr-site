{{/* Timezone selector. All elements with data-utc are re-rendered client-side. */}}
<div class="tz-bar" role="group" aria-label="Display timezone">
  <label for="tz-select">Show times in</label>
  <select id="tz-select">
    <option value="auto">My timezone (automatic)</option>
    <option value="Europe/London">London — UK time (GMT/BST)</option>
    <option value="Europe/Berlin">Berlin — Central Europe (CET/CEST)</option>
    <option value="America/New_York">New York — Eastern (EST/EDT)</option>
    <option value="America/Chicago">Chicago — Central (CST/CDT)</option>
    <option value="America/Los_Angeles">Los Angeles — Pacific (PST/PDT)</option>
    <option value="Asia/Kolkata">India — IST</option>
    <option value="Asia/Shanghai">Shanghai — CST</option>
    <option value="Asia/Tokyo">Tokyo — JST</option>
    <option value="Australia/Sydney">Sydney — AEST/AEDT</option>
  </select>
  <span class="tz-note">Sessions are held at 14:00 UK time.</span>
</div>
