<header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a href="{{ "/" | relURL }}" class="brand" aria-label="{{ .Site.Title }} home">
      {{ partial "mark.html" . }}
      <span class="brand-text">
        <span class="brand-name">International Tea Room</span>
        <span class="brand-sub">gastruloids &amp; stem cell-based embryo models</span>
      </span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-menu">
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL | relURL }}"
           class="{{ if .Params.cta }}nav-cta{{ end }}{{ if or ($.IsMenuCurrent "main" .) (hasPrefix $.RelPermalink .URL) }} active{{ end }}"
           {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>{{ .Name }}</a>
      </li>
      {{ end }}
    </ul>
  </nav>
</header>
<script>
  document.querySelector('.nav-toggle')?.addEventListener('click', function () {
    const open = this.getAttribute('aria-expanded') === 'true';
    this.setAttribute('aria-expanded', String(!open));
    document.getElementById('nav-menu')?.classList.toggle('open');
  });
</script>
