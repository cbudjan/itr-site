<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}" data-design="{{ .Site.Params.design | default "tearoom" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body class="design-{{ .Site.Params.design | default "tearoom" }}{{ if .IsHome }} is-home{{ end }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {{- partial "nav.html" . -}}
  <main id="main-content">
    {{- block "main" . }}{{- end }}
  </main>
  {{- partial "footer.html" . -}}
  {{ $js := resources.Get "js/timezone.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
